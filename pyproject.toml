[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medipick-core"
version = "1.0.0"
description = "MediPick Shared Core — Unified SQLAlchemy Database Models, Alembic Migrations, Enums, and Security Utilities"
readme = "README.md"
authors = [
    { name = "MediPick Team" }
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "pyjwt>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["medipick_core*"]
